<!--
    Page 1 HTML Template

    Purpose:
        Displays the content of Page 1 in the User Access Control
        application.

    Features:
        1. Displays the Page 1 heading.
        2. Shows a description of the page.
        3. Provides a navigation link to return to the home page.

    Page Access:
        This page is protected by the application's access-control system.
        Only authenticated users who have been assigned permission
        to access page1 can open this page.

    CSS Files:
        /static/style.css:
            Provides common application styling and page layout.

        /static/access.css:
            Provides additional styling for access-control pages.

    Navigation:
        /home:
            Redirects the user to the home page when clicked.

    Template Usage:
        Loaded by the dynamically registered page1 route after
        authentication and permission checks are completed.
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page 1</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/access.css">
</head>
<body>
<main class="center">
  <section class="card">
    <h1>Page 1</h1>
    <p>This is page 1.</p>
    <a href="/home">Back to home</a>
  </section>
</main>
</body>
</html>
